[package]
edition = "2024"
name = "footswitch-firmware"
version = "0.1.0"
description = "Firmware for the modular USB MIDI footswitch (Raspberry Pi Pico)"
license = "MIT OR Apache-2.0"

[dependencies]
footswitch-core = { path = "../core" }

cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = { version = "1.0.0" }

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

# The template's rp-pico BSP pulls in rp2040-hal 0.10, but rp2040-flash needs 0.11, so this
# uses the HAL directly (the template's documented alternative to a BSP).
rp2040-hal = { version = "0.11", features = ["rt", "critical-section-impl"] }
rp2040-boot2 = "0.3"
rp2040-flash = "0.6"
pio = "0.2"
pio-proc = "0.2"

usb-device = "0.3"
usbd-midi = "0.5"
heapless = "0.9"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
